name: Package

on: workflow_dispatch

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-2022, ubuntu-22.04, ubuntu-22.04-arm, macos-15-intel, macos-14]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Clear Java tool-cache for reproducibility
        shell: bash
        run: rm -rf "$RUNNER_TOOL_CACHE"/Java_*
      - name: Set up JDK 25.0.2
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25.0.2'
      - name: Show Build Versions
        run: ./gradlew -v
      - name: Build with Gradle
        run: ./gradlew jpackage
      - name: Detect macOS signing availability
        if: ${{ runner.os == 'macOS' }}
        id: macos_signing
        shell: bash
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_NOTARIZATION_APPLE_ID: ${{ secrets.MACOS_NOTARIZATION_APPLE_ID }}
          MACOS_NOTARIZATION_TEAM_ID: ${{ secrets.MACOS_NOTARIZATION_TEAM_ID }}
          MACOS_NOTARIZATION_PASSWORD: ${{ secrets.MACOS_NOTARIZATION_PASSWORD }}
        run: |
          if [ -n "$MACOS_CERTIFICATE" ] && [ -n "$MACOS_CERTIFICATE_PASSWORD" ] && \
             [ -n "$MACOS_NOTARIZATION_APPLE_ID" ] && [ -n "$MACOS_NOTARIZATION_TEAM_ID" ] && \
             [ -n "$MACOS_NOTARIZATION_PASSWORD" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Package unsigned macOS distribution
        if: ${{ runner.os == 'macOS' }}
        run: ./gradlew packageUnsignedMacDistribution
      - name: Codesign, package and notarize macOS distribution
        if: ${{ runner.os == 'macOS' && steps.macos_signing.outputs.available == 'true' }}
        uses: sparrowwallet/github-actions/codesign-macos@v1
        with:
          app-name: Sparrow
          certificate: ${{ secrets.MACOS_CERTIFICATE }}
          certificate-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          apple-id: ${{ secrets.MACOS_NOTARIZATION_APPLE_ID }}
          team-id: ${{ secrets.MACOS_NOTARIZATION_TEAM_ID }}
          notarization-password: ${{ secrets.MACOS_NOTARIZATION_PASSWORD }}
      - name: Package Windows zip distribution
        if: ${{ runner.os == 'Windows' }}
        run: ./gradlew packageZipDistribution
      - name: Package Linux tar distribution
        if: ${{ runner.os == 'Linux' }}
        run: ./gradlew packageTarDistribution
      - name: Repackage Linux deb distribution
        if: ${{ runner.os == 'Linux' }}
        run: ./repackage.sh
      - name: Upload macOS unsigned artifact
        if: ${{ runner.os == 'macOS' }}
        uses: actions/upload-artifact@v6
        with:
          name: Sparrow Build - macOS ${{ runner.arch }} Unsigned
          path: build/jpackage/Sparrow-*-unsigned-*.zip
      - name: Upload macOS signed artifact
        if: ${{ runner.os == 'macOS' && steps.macos_signing.outputs.available == 'true' }}
        uses: actions/upload-artifact@v6
        with:
          name: Sparrow Build - macOS ${{ runner.arch }} Signed
          path: |
            build/jpackage/Sparrow-*-x86_64.dmg
            build/jpackage/Sparrow-*-aarch64.dmg
      - name: Upload Artifact
        if: ${{ runner.os != 'macOS' }}
        uses: actions/upload-artifact@v6
        with:
          name: Sparrow Build - ${{ runner.os }} ${{ runner.arch }}
          path: |
            build/jpackage/*
            !build/jpackage/Sparrow/
            !build/jpackage/Sparrow.app/
      - name: Headless build with Gradle
        if: ${{ runner.os == 'Linux' }}
        run: ./gradlew -Djava.awt.headless=true clean jpackage
      - name: Package Linux headless tar distribution
        if: ${{ runner.os == 'Linux' }}
        run: ./gradlew -Djava.awt.headless=true packageTarDistribution
      - name: Repackage Linux headless deb distribution
        if: ${{ runner.os == 'Linux' }}
        run: ./repackage.sh
      - name: Upload Headless Artifact
        if: ${{ runner.os == 'Linux' }}
        uses: actions/upload-artifact@v6
        with:
          name: Sparrow Build - ${{ runner.os }} ${{ runner.arch }} Headless
          path: |
            build/jpackage/*
            !build/jpackage/Sparrow/
